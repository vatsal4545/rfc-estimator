name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build first: Next generates the LayoutProps/route types that tsc needs.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
