# Deploys the app to GitHub Pages as a static site on every push to main.
# One-time setup on github.com: repo Settings → Pages → Source: "GitHub Actions".
# Note: on a free GitHub plan, Pages only works on PUBLIC repos.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          # Pages serves project sites at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
